[package]
edition = "2024"
name = "stardust-xr-protocol"
authors = ["Nova King <technobaboo@protonmail.me", "Philpax"]
description = "Stardust XR protocol, generated from custom IDL automatically"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
gluon = { git = "https://github.com/technobaboo/gluon" }
fnv = "1.0.7"
glam = { version = "0.29.0", features = ["mint"] }
thiserror = "2.0.16"
tokio = "1.49.0"
mint = "0.5.9"
xdg = "3.0.0"
rustix = { version = "1.0.8", features = ["time"] }
shiva-color-rs = "0.0.1"
serde = { version = "1.0.228", features = ["derive"], optional = true }

[build-dependencies]
syn = "2"
prettyplease = "0.2"
gluon-codegen = { git = "https://github.com/technobaboo/gluon" }

[features]
serde = ["dep:serde", "mint/serde"]
