[workspace]
resolver = "2"
members = ["fusion", "protocol"]
package.version = "0.53.0-rc.1"
package.repository = "https://github.com/StardustXR/core/"
package.homepage = "https://stardustxr.org"
package.license = "MIT"

[workspace.dependencies]
glam = { version = "0.33.7", features = ["mint"] }
tracing = "0.1.44"
gluon-ipc = { version = "0.1.1", features = ["tracing"] }
stardust-xr-protocol = { version = "0.53.0-rc.1", path = "./protocol" }
